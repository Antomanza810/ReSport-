<style>
    * {
    padding: 0;
    margin: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background-color: #888888;
    overflow: hidden;
    height: 100vh;
    position: relative;
}

.Inicio {
    font-weight: 350;
    font-size: 2rem;
    color: #ffffff;
    margin-left: 2vw;
    margin-top: 1vh;
    text-decoration: none;
    cursor: pointer;
    position: relative;
    z-index: 10;
}

/* --- FORMULARIO Y CAMPOS DE ENTRADA --- */

.contenedor-formulario {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%); /* Centrado exacto en pantalla */
    z-index: 10;
    width: 380px;
}

.contenedor-formulario h2 {
    color: white;
    margin-bottom: 1vh;
    font-weight: 400;
    font-size: 2rem;
    text-align: center;
}

.input-container {
    position: relative;
    margin-bottom: 12px;
}

.input-container input {
    width: 100%;
    height: 48px;
    padding: 14px 14px 0px 14px;
    border: none;
    border-radius: 10px;
    background-color: rgba(255, 255, 255, 0.45); /* Fondo gris translúcido como la imagen */
    color: #333333;
    font-size: 0.95rem;
    outline: none;
    box-sizing: border-box;
}

.input-container label {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: #666666;
    font-size: 0.95rem;
    pointer-events: none;
    transition: all 0.2s ease;
    width: calc(100% - 28px);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* Estilo para el título de la etiqueta (Email:, Nombre:, etc.) */
.label-title {
    color: #222222;
