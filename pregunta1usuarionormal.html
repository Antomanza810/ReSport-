<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preguntas - ReSport+</title>
</head>
<body>

    <main class="contenedor-pregunta">
        <h1 class="titulo-app">ReSport+</h1>

        <div class="barra-progreso-contenedor">
            <div class="barra-progreso-relleno"></div>
        </div>

        <h2 class="pregunta-titulo">Cual es tu edad ?</h2>

        <form id="form-edad" class="opciones-form">
            <label class="opcion-card">
                <input type="radio" name="edad" value="18-23" required>
                <span>18-23</span>
            </label>

            <label class="opcion-card">
                <input type="radio" name="edad" value="24-29">
                <span>24-29</span>
            </label>

            <label class="opcion-card">
                <input type="radio" name="edad" value="30s">
                <span>30-39</span>
            </label>

            <label class="opcion-card">
                <input type="radio" name="edad" value="40s">
                <span>40-49</span>
            </label>

            <label class="opcion-card">
                <input type="radio" name="edad" value="50+">
                <span>50+</span>
            </label>
        </form>
    </main>

    <script>
        const form = document.getElementById('form-edad');
        const inputs = form.querySelectorAll('input[type="radio"]');
        const emailUsuario = localStorage.getItem('usuarioEmail');

        const guardarEdad = async (respuesta) => {
            if (!emailUsuario) {
                localStorage.setItem('edadUsuario', respuesta);
                return;
            }

            const response = await fetch(`/usuarios/${encodeURIComponent(emailUsuario)}/respuestas`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ edad: respuesta }),
            });

            const data = await response.json();

            if (!response.ok) {
                console.error(data.message || 'No se pudo guardar la respuesta.');
                return;
            }

            localStorage.setItem('edadUsuario', respuesta);
            console.log(data.message);
        };

        inputs.forEach(input => {
            input.addEventListener('change', () => {
                const respuesta = input.value;
                guardarEdad(respuesta);
            });
        });
    </script>
    <section>
        <a href="pregunta2usuarionormal.html" class="siguiente">Siguiente</a>
    </section>
</body>
</html>
