<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preguntas - ReSport+</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>

    <main class="contenedor-pregunta">
        <h1 class="titulo-app">ReSport+</h1>

        <div class="barra-progreso-contenedor">
            <div class="barra-progreso-relleno"></div>
        </div>

        <h2 class="pregunta-titulo">Que equipo tenes disponible ?</h2>

        <form id="form-equipamiento" class="opciones-form">
            <label class="opcion-card">
                <input type="checkbox" name="equipamiento" value="Mancuernas">
                <span class="texto-opcion">Mancuernas</span>
                <span class="casilla-custom"></span>
            </label>

            <label class="opcion-card">
                <input type="checkbox" name="equipamiento" value="Maquinas o cables">
                <span class="texto-opcion">Maquinas o cables</span>
                <span class="casilla-custom"></span>
            </label>

            <label class="opcion-card">
                <input type="checkbox" name="equipamiento" value="Bandas de resistencia">
                <span class="texto-opcion">Bandas de resistencia</span>
                <span class="casilla-custom"></span>
            </label>

            <label class="opcion-card">
                <input type="checkbox" name="equipamiento" value="Banco">
                <span class="texto-opcion">Banco</span>
                <span class="casilla-custom"></span>
            </label>

            <label class="opcion-card">
                <input type="checkbox" name="equipamiento" value="Sin equipo">
                <span class="texto-opcion">Sin equipo</span>
                <span class="casilla-custom"></span>
            </label>
        </form>
    </main>

    <section class="navegacion-inferior">
        <a href="pregunta5usuarionormal.html" class="boton-volver">
            <span class="material-icons icon-flecha">arrow_back</span>
        </a>
        <a href="pregunta7usuarionormal.html" class="siguiente">Siguiente</a>
    </section>

    <script>
        const form = document.getElementById('form-equipamiento');
        const inputs = form.querySelectorAll('input[type="checkbox"]');

        inputs.forEach(input => {
            input.addEventListener('change', () => {
                const seleccionados = Array.from(inputs)
                    .filter(i => i.checked)
                    .map(i => i.value);
                
                const datosPrevios = JSON.parse(localStorage.getItem('tempUser')) || {};
                const datosActualizados = {
                    ...datosPrevios,
                    equipamiento: seleccionados
                };
                localStorage.setItem('tempUser', JSON.stringify(datosActualizados));
            });
        });
    </script>
</body>
</html>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

body {
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    min-height: 100vh;
    background-color: #888888;
    padding-top: 5rem;
}

.contenedor-pregunta {
    width: 90%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.titulo-app {
    font-size: 2.2rem;
    font-weight: 500;
    color: #000000;
    margin-bottom: 0.6rem;
    text-align: center;
}

.barra-progreso-contenedor {
    width: 100%;
    height: 6px;
    background-color: #e0e0e0;
    border-radius: 10px;
    margin-bottom: 2rem;
    overflow: hidden;
}

.barra-progreso-relleno {
    width: 85.2%;
    height: 100%;
    background-color: #ff0000;
    border-radius: 10px;
    transition: width 0.3s ease;
}

.pregunta-titulo {
    width: 100%;
    font-size: 1.35rem;
    font-weight: 500;
    color: #000000;
    margin-bottom: 1.5rem;
    text-align: center;
}

.opciones-form {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 0.8rem;
}

.opcion-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 0.75rem 1rem;
    background-color: #a8a6a6;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.15s ease;
    user-select: none;
}

.opcion-card input[type="checkbox"] {
    display: none;
}

.texto-opcion {
    font-size: 1.1rem;
    color: #000000;
    font-weight: 400;
}

.casilla-custom {
    width: 26px;
    height: 26px;
    border: 2px solid #666666;
    border-radius: 6px;
    background-color: transparent;
    transition: all 0.2s ease;
}

.opcion-card input[type="checkbox"]:checked ~ .casilla-custom {
    background-color: #ff0000;
    border-color: #ff0000;
}

.navegacion-inferior {
    position: absolute;
    bottom: 10vh;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 1rem;
    align-items: center;
    justify-content: center;
    z-index: 10;
}

.boton-volver {
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    cursor: pointer;
    border-radius: 50%;
    width: 48px;
    height: 48px;
    background-color: #a8a8a8;
    transition: background-color 0.15s ease;
}

.boton-volver:hover {
    background-color: #8f8f8f;
}

.icon-flecha {
    color: #000000;
    font-size: 24px;
}

.siguiente {
    padding: 0.6rem 2rem;
    border-radius: 8px;
    background-color: #a8a8a8;
    color: #000000;
    font-weight: 500;
    font-size: 1.1rem;
    cursor: pointer;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 48px;
}
</style>
