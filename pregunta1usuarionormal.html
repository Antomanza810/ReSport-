<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preguntas - ReSport+</title>
</head>
<body>

    <main class="contenedor-pregunta">
        <h1 class="titulo-app">ReSport+</h1>

        <div class="barra-progreso-contenedor">
            <div class="barra-progreso-relleno"></div>
        </div>

        <h2 class="pregunta-titulo">Cual es tu edad ?</h2>

        <form id="form-edad" class="opciones-form">
            <label class="opcion-card">
                <input type="radio" name="edad" value="18-23" required>
                <span>18-23</span>
            </label>

            <label class="opcion-card">
                <input type="radio" name="edad" value="24-29">
                <span>24-29</span>
            </label>

            <label class="opcion-card">
                <input type="radio" name="edad" value="30s">
                <span>30-39</span>
            </label>

            <label class="opcion-card">
                <input type="radio" name="edad" value="40s">
                <span>40-49</span>
            </label>

            <label class="opcion-card">
                <input type="radio" name="edad" value="50+">
                <span>50+</span>
            </label>
        </form>
    </main>

    <script>
        const form = document.getElementById('form-edad');
        const inputs = form.querySelectorAll('input[type="radio"]');

        inputs.forEach(input => {
            input.addEventListener('change', () => {
                const respuesta = input.value;
                localStorage.setItem('edadUsuario', respuesta);
            });
        });
    </script>
    <section>
        <a href="pregunta2usuarionormal.html" class="siguiente">Siguiente</a>
    </section>
</body>
</html>

<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

.siguiente {
    position: absolute;
    bottom: 10vh; /* Cambia este número si lo querés más arriba o abajo */
    left: 50%;
    transform: translateX(-50%); /* Estos dos trucos lo centran horizontalmente */
    z-index: 10;
    padding: 1.4vh 1.6vw;
    border-radius: 0.5rem;
    background-color: rgba(118, 118, 118, 0.46);
    color: #ffffff;
    font-weight: 400;
    font-size: 1.4rem;
    cursor: pointer;
    text-decoration: none;
    width: 9vw;
    height: 6vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background-color: #404040;
}

.contenedor-pregunta {
    width: 90%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
}


.titulo-app {
    font-size: 2.2rem;
    font-weight: 500;
    color: #000000;
    margin-bottom: 0.6rem;
    text-align: center;
    margin-top: -10rem;
}

.barra-progreso-contenedor {
    width: 100%;
    height: 6px;
    background-color: #e0e0e0;
    border-radius: 10px;
    margin-bottom: 2rem;
    overflow: hidden;
}

.barra-progreso-relleno {
    width: 14.2%;
    height: 100%;
    background-color: #ff0000;
    border-radius: 10px;
    transition: width 0.3s ease;
}

/* --- PREGUNTA --- */
.pregunta-titulo {
    width: 100%;
    font-size: 1.35rem;
    font-weight: 500;
    color: #ffffff;
    margin-bottom: 1.5rem;
    text-align: left;
}

/* --- OPCIONES DE SELECCIÓN --- */
.opciones-form {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 0.8rem;
}

.opcion-card {
    display: flex;
    align-items: center;
    width: 100%;
    padding: 0.85rem 1.2rem;
    background-color: rgba(118, 118, 118, 0.46);
    border-radius: 14px;
    border: 2px solid transparent;
    cursor: pointer;
    transition: all 0.15s ease;
    user-select: none;
}

.opcion-card input[type="radio"] {
    display: none;
}

.opcion-card span {
    font-size: 1.1rem;
    color: #ffffff;

.opcion-card:has(input[type="radio"]:checked) {

</style>
