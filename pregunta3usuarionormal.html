<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preguntas - ReSport+</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>

    <main class="contenedor-pregunta">
        <h1 class="titulo-app">ReSport+</h1>

        <div class="barra-progreso-contenedor">
            <div class="barra-progreso-relleno"></div>
        </div>

        <h2 class="pregunta-titulo">Cual es tu objetivo ?</h2>

        <form id="form-edad" class="opciones-form">
            <label class="opcion-card">
                <input type="radio" name="objetivo" value="Ganar musculo" required>
                <span>Ganar musculo</span>
            </label>

            <label class="opcion-card">
                <input type="radio" name="objetivo" value="Perder peso">
                <span>Perder peso</span>
            </label>

            <label class="opcion-card">
                <input type="radio" name="objetivo" value="Perder grasa y ganar musculo">
                <span>Perfer grasa y ganar musculo</span>
            </label>

            <label class="opcion-card">
                <input type="radio" name="objetivo" value="Mejorar mi estado fisico general">
                <span>Mejorar mi estado fisico general</span>
            </label>
        </form>
    </main>

    <script>
        const form = document.getElementById('form-edad');
        const inputs = form.querySelectorAll('input[type="radio"]');

        inputs.forEach(input => {
            input.addEventListener('change', () => {
                const respuesta = input.value;
                localStorage.setItem('edadUsuario', respuesta);
            });
        });
    </script>
<section class="navegacion-inferior">
    <a href="pregunta2usuarionormal.html" class="boton-volver">
        <span class="material-icons icon-flecha">arrow_back</span>
    </a>
    <a href="pregunta4usuarionormal.html" class="siguiente">Siguiente</a>
</section>
</body>
</html>

<style>* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background-color: #404040;
}

/* --- CONTENEDOR PRINCIPAL --- */
.contenedor-pregunta {
    width: 90%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.titulo-app {
    font-size: 2.2rem;
    font-weight: 500;
    color: #ffffff;
    margin-bottom: 0.6rem;
    text-align: center;
}

.barra-progreso-contenedor {
    width: 100%;
    height: 6px;
    background-color: #e0e0e0;
    border-radius: 10px;
    margin-bottom: 2rem;
    overflow: hidden;
}

.barra-progreso-relleno {
    width: 42.6%; /* Ajustá este porcentaje en cada pantalla según el progreso */
    height: 100%;
    background-color: #ff0000;
    border-radius: 10px;
    transition: width 0.3s ease;
}

.pregunta-titulo {
    width: 100%;
    font-size: 1.35rem;
    font-weight: 500;
    color: #ffffff;
    margin-bottom: 1.5rem;
    text-align: left;
}

/* --- OPCIONES DE SELECCIÓN --- */
.opciones-form {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 0.8rem;
}

.opcion-card {
    display: flex;
    align-items: center;
    width: 100%;
    padding: 0.85rem 1.2rem;
    background-color: rgba(118, 118, 118, 0.46);
    border-radius: 14px;
    border: 2px solid transparent;
    cursor: pointer;
    transition: all 0.15s ease;
    user-select: none;
}

.opcion-card input[type="radio"] {
    display: none;
}

.opcion-card span {
    font-size: 1.1rem;
    color: #ffffff;
    font-weight: 600;
}

.opcion-card:has(input[type="radio"]:checked) {
    border-color: #0088ff;
    background-color: #b8b8b8;
}

.opcion-card:hover {
    background-color: #b2b2b2;
}

/* --- NAVEGACIÓN INFERIOR (BOTONES) --- */
.navegacion-inferior {
    position: absolute;
    bottom: 8vh;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.2rem;
    z-index: 10;
}

.boton-volver {
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    cursor: pointer;
    border-radius: 50%;
    width: 6vh;
    height: 6vh;
    background-color: rgba(118, 118, 118, 0.46);
    transition: background-color 0.15s ease;
}

.boton-volver:hover {
    background-color: #b2b2b2;
}

.icon-flecha {
    color: #ffffff;
    font-size: 1.8rem;
}

.siguiente {
    padding: 0 1.5rem;
    border-radius: 0.5rem;
    background-color: rgba(118, 118, 118, 0.46);
    color: #ffffff;
    font-weight: 500;
    font-size: 1.1rem;
    cursor: pointer;
    text-decoration: none;
    height: 6vh;
    min-width: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background-color 0.15s ease;
}

.siguiente:hover {
    background-color: #b2b2b2;
}
</style>
