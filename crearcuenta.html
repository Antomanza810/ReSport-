<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta</title>
</head>
<body>
    
    <a href="paginaprincipalanto.html" class="Inicio">ReSport+</a>


    <main class="contenedor-formulario">
        <h2>Crear cuenta:</h2>
        <form action="#">
            
            <div class="input-container">
                <input type="email" id="email" placeholder=" " required>
                <label for="email"><span class="label-title">Email:</span> ingresá tu mail</label>
            </div>

            <div class="input-container">
                <input type="text" id="nombre" placeholder=" " required>
                <label for="nombre"><span class="label-title">Nombre:</span> ingresá tu nombre</label>
            </div>

            <div class="input-container">
                <input type="text" id="apellido" placeholder=" " required>
                <label for="apellido"><span class="label-title">Apellido:</span> ingresá tu apellido</label>
            </div>

            <div class="input-container">
                <input type="password" id="password" placeholder=" " required>
                <label for="password"><span class="label-title">Contraseña:</span> ingresá tu contraseña</label>
            </div>

            <div class="input-container">
                <input type="password" id="confirm-password" placeholder=" " required>
                <label for="confirm-password"><span class="label-title">Confirmar Contraseña:</span> repita la contraseña</label>
            </div>

            <div class="input-container">
                <input type="text" id="dni" placeholder=" " required>
                <label for="dni"><span class="label-title">Dni:</span> ingresá tu dni</label>
            </div>

        </form>
    </main>

    
    <button type="button" class="btn-medico">Soy Medico</button>

    <!-- IMÁGENES DE FONDO -->
    <section class="imagen2crearcuenta">
        <img src="https://www.basic-fit.com/on/demandware.static/-/Library-Sites-basic-fit-shared-library/default/dw16c1178a/Blogs/New%20fitness%20routine/Landscape-BasicFit%20Tilburg%2026-8-2114052.jpg" alt="imagen2crearcuenta">
    </section>
    <section class="imagen1crearcuenta">
        <img src="https://img.asmedia.epimg.net/resizer/v2/WLNK6KSK6RCRTAWMFY7TN6ANQY.jpg?auth=167c001e33907445cbbd39dfd91dfcd7d57d86ec097082d196af212c82a82d80&width=1200&height=1200&smart=true" alt="imagen1crearcuenta">
    </section>
    <section class="imagen4crearcuenta">
        <img src="https://unsplash.com/es/s/fotos/hombre-fitness" alt="imagen4crearcuenta">
    </section>

</body>
</html>


<style>
    * {
    padding: 0;
    margin: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background-color: #888888;
    overflow: hidden;
    height: 100vh;
    position: relative;
}

.Inicio {
    font-weight: 350;
    font-size: 2rem;
    color: #ffffff;
    margin-left: 2vw;
    margin-top: 1vh;
    text-decoration: none;
    cursor: pointer;
    position: relative;
    z-index: 10;
}

/* --- FORMULARIO Y CAMPOS DE ENTRADA --- */

.contenedor-formulario {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%); /* Centrado exacto en pantalla */
    z-index: 10;
    width: 380px;
}

.contenedor-formulario h2 {
    color: white;
    margin-bottom: 20px;
    font-weight: 400;
    font-size: 2rem;
    text-align: center;
}

.input-container {
    position: relative;
    margin-bottom: 12px;
}

.input-container input {
    width: 100%;
    height: 48px;
    padding: 14px 14px 0px 14px;
    border: none;
    border-radius: 10px;
    background-color: rgba(255, 255, 255, 0.45); /* Fondo gris translúcido como la imagen */
    color: #333333;
    font-size: 0.95rem;
    outline: none;
    box-sizing: border-box;
}

.input-container label {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: #666666;
    font-size: 0.95rem;
    pointer-events: none;
    transition: all 0.2s ease;
    width: calc(100% - 28px);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* Estilo para el título de la etiqueta (Email:, Nombre:, etc.) */
.label-title {
    color: #222222;
    font-weight: bold;
}

/* EFECTO: Se activa al hacer clic (:focus) o al escribir (:not(:placeholder-shown)) */
.input-container input:focus ~ label,
.input-container input:not(:placeholder-shown) ~ label {
    top: 10px;
    transform: translateY(0);
    font-size: 0.7rem;
}

.input-container input:focus ~ label .label-title,
.input-container input:not(:placeholder-shown) ~ label .label-title {
    color: #000000;
}

.input-container input:focus {
    background-color: rgba(255, 255, 255, 0.65);
}

/* --- BOTÓN SOY MEDICO --- */

.btn-medico {
    position: absolute;
    bottom: 25px;
    right: 30px;
    z-index: 10;
    padding: 12px 24px;
    border: none;
    border-radius: 8px;
    background-color: rgba(255, 255, 255, 0.55);
    color: #222222;
    font-size: 1rem;
    cursor: pointer;
    transition: background-color 0.2s ease;
}

.btn-medico:hover {
    background-color: rgba(255, 255, 255, 0.8);
}

/* --- IMÁGENES DE FONDO --- */

.imagen1crearcuenta {  
    position: absolute;
    top: 0;
    right: 0;
    z-index: 1;
    pointer-events: none;
    transform: rotate(25deg) translateX(-5vw) translateY(-10vh);
}

.imagen1crearcuenta img {
    width: 50vw;
    height: 65vh;
    object-fit: cover;
    opacity: 0.20;
    border-radius: 45px;
}

.imagen2crearcuenta {  
    position: absolute;
    bottom: -10vh;
    right: 5vw;
    z-index: 1;
    pointer-events: none;
    transform: rotate(-25deg) translateX(5vw) translateY(10vh);
}

.imagen2crearcuenta img {
    width: 45vw;
    height: 60vh;
    object-fit: cover;
    opacity: 0.20;
    border-radius: 45px;
}

.imagen4crearcuenta {  
    position: absolute;
    bottom: -10vh;
    right: 5vw;
    z-index: 1;
    pointer-events: none;
    transform: rotate(-20deg) translateX(55vw) translateY(-90vh);
}

.imagen4crearcuenta img {
    width: 35vw;
    height: 100vh;
    object-fit: cover;
    opacity: 0.20;
    border-radius: 45px;
}
</style>
