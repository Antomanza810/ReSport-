<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReSport+</title>
  <link rel="stylesheet" href="paginaconcuenta.css">
</head>
<body>

  <section class="arriba">
    <!-- Sección de Perfil / Usuario -->
    <div class="header-section profile-section">
      <button class="profile-btn" id="profileBtn" type="button">
        <!-- Ícono por defecto -->
        <div class="user-avatar-default" id="defaultAvatar">
          <div class="head"></div>
          <div class="body"></div>
        </div>
        <!-- Foto de perfil personalizada -->
        <img id="userPhoto" class="user-photo hidden" src="" alt="Foto de Perfil">
      </button>

      <div class="divider"></div>

      <!-- Nombre del usuario -->
      <div class="user-name" id="userNameDisplay">Nombre</div>
    </div>

    <div class="divider"></div>

    <!-- Título de la Aplicación -->
    <div class="header-section app-title-section">
      <a href="paginaprincipalanto.html" class="app-title">ReSport+</a>
    </div>

    <div class="divider"></div>

    <!-- Botón de Ajustes -->
    <div class="header-section settings-section">
      <button class="settings-btn" id="settingsBtn" type="button">
        <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAOEAAADhCAMAAAAJbSJIAAAAYFBMVEX///90dHRycnJubm78/Px2dnbz8/Ovr69vb29ra2tnZ2f19fXx8fF8fHyAgIDOzs7n5+fe3t7U1NSWlpaqqqrLy8uenp6GhoakpKTk5OSLi4tjY2O1tbW/v7/Z2dmRkZF2i+3+AAALFElEQVR4nO1dC5ejKgxWIBZ8tPY9nc7j///LS7CdqVWDiuJ0L985e7Y720E+IZCEJERRQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAwD8EkSRZC3KxdMemQlkoqRrgShXl0l2bCCsFcRPAQH1E/8Ywrji0UGQAfLV01yb * (resto de la cadena base64 igual) *" alt="Ajustes" class="settings-img">
      </button>
    </div>
  </section>

  <!-- Modal 1: Formulario de Inicio de Sesión -->
  <div class="modal-overlay hidden" id="loginModal">
    <div class="modal-box">
      <h2>Iniciar Sesión</h2>
      <form id="loginForm">
        <div class="form-group">
            <label for="emailInput">Correo electrónico:</label>
            <input type="email" id="emailInput" required placeholder="Ingrese su mail">
        </div>
        <div class="form-group">
          <label for="passwordInput">Contraseña:</label>
          <input type="password" id="passwordInput" required placeholder="Ingrese su contraseña">
        </div>
        <div class="modal-actions">
          <button type="submit" class="btn-primary">Ingresar</button>
          <button type="button" class="btn-secondary" id="closeLoginBtn">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal 2: Edición del Perfil -->
  <div class="modal-overlay hidden" id="editProfileModal">
    <div class="modal-box">
      <h2>Editar Perfil</h2>
      <form id="editProfileForm">
        <div class="form-group">
          <label for="editNameInput">Nombre:</label>
          <input type="text" id="editNameInput" required>
        </div>
        <div class="form-group">
          <label for="editPhotoUrlInput">URL de la Foto:</label>
          <input type="url" id="editPhotoUrlInput" required placeholder="https://ejemplo.com/foto.jpg">
        </div>
        <div class="modal-actions">
          <button type="submit" class="btn-primary">Guardar Cambios</button>
          <button type="button" class="btn-secondary" id="closeEditBtn">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- CONTENEDOR PRINCIPAL FLEX -->
  <main class="contenido-principal">
    <section class="menu-lateral">
      <a href="armaturutina.html" class="item-menu">
        <div>ARMA TU RUTINA</div>
      </a>
      <a href="registrosmedicos.html" class="item-menu">
        <div>REGISTROS MEDICOS</div>
      </a>
      <a href="mapamundial.html" class="item-menu">
        <div>MAPA MUNDIAL</div>
      </a>
    </section>

    <div class="calendar-container">
      <!-- Header: Navegación de Mes -->
      <div class="calendar-header">
        <button class="nav-btn" id="prevMonth">&lt;</button>
        <h2 id="monthYearDisplay">OCTUBRE</h2>
        <button class="nav-btn" id="nextMonth">&gt;</button>
      </div>

      <!-- Grilla de Días -->
      <div class="calendar-grid" id="calendarGrid">
        <!-- Celdas generadas con JavaScript -->
      </div>
    </div>
  </main>

  <!-- Modal para Agregar Evento -->
  <div class="modal-overlay hidden" id="eventModal">
    <div class="modal-box">
      <h3>Agregar Evento</h3>
      <form id="eventForm">
        <div class="form-group">
          <label for="eventText">Texto / Título:</label>
          <input type="text" id="eventText" placeholder="Ej: Entrenamiento de brazos" required>
        </div>
        <div class="form-group">
          <label for="eventTime">Hora:</label>
          <input type="text" id="eventTime" placeholder="Ej: 5 PM o 4 AM" required>
        </div>
        <div class="form-group">
          <label for="eventType">Tipo (Color):</label>
          <select id="eventType">
            <option value="entrenamiento">Entrenamiento (Rojo)</option>
            <option value="consulta">Consulta Médica (Azul)</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="submit" class="btn btn-primary">Guardar</button>
          <button type="button" class="btn" id="closeModal">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const profileBtn = document.getElementById('profileBtn');
    const defaultAvatar = document.getElementById('defaultAvatar');
    const userPhoto = document.getElementById('userPhoto');
    const userNameDisplay = document.getElementById('userNameDisplay');

    const loginModal = document.getElementById('loginModal');
    const loginForm = document.getElementById('loginForm');
    const closeLoginBtn = document.getElementById('closeLoginBtn');
    const emailInput = document.getElementById('emailInput');

    const editProfileModal = document.getElementById('editProfileModal');
    const editProfileForm = document.getElementById('editProfileForm');
    const closeEditBtn = document.getElementById('closeEditBtn');

    const editNameInput = document.getElementById('editNameInput');
    const editPhotoUrlInput = document.getElementById('editPhotoUrlInput');
    const settingsBtn = document.getElementById('settingsBtn');

    // Cargar datos guardados del navegador
    let currentUser = JSON.parse(localStorage.getItem('currentUser'));

    function updateUI() {
      if (currentUser) {
        defaultAvatar.classList.add('hidden');
        userPhoto.src = currentUser.photoUrl || "https://media.istockphoto.com/id/1337144146/vector/default-avatar-profile-icon-vector.jpg?s=612x612&w=0&k=20&c=BIbFwuv7FxTWvh5S3vB6bkT0Qv8Vn8N5Ffseq84ClGI=";
        userPhoto.classList.remove('hidden');
        userNameDisplay.textContent = currentUser.nombre || currentUser.email.split('@')[0];
      } else {
        defaultAvatar.classList.remove('hidden');
        userPhoto.classList.add('hidden');
        userNameDisplay.textContent = "Nombre";
      }
    }

    updateUI();

    profileBtn.addEventListener('click', () => {
      if (!currentUser) {
        window.location.href = 'paginainiciarsesion.html';
      } else {
        editNameInput.value = currentUser.nombre;
        editPhotoUrlInput.value = currentUser.photoUrl || '';
        editProfileModal.classList.remove('hidden');
      }
    });

    editProfileForm.addEventListener('submit', (e) => {
      e.preventDefault();
      
      currentUser.nombre = editNameInput.value.trim();
      currentUser.photoUrl = editPhotoUrlInput.value.trim();

      localStorage.setItem('currentUser', JSON.stringify(currentUser));
      localStorage.setItem('registeredUser', JSON.stringify(currentUser));

      updateUI();
      editProfileModal.classList.add('hidden');
    });

    closeLoginBtn.addEventListener('click', () => loginModal.classList.add('hidden'));
    closeEditBtn.addEventListener('click', () => editProfileModal.classList.add('hidden'));

    settingsBtn.addEventListener('click', () => {
      alert("Abriendo panel de Ajustes...");
    });

    const calendarGrid = document.getElementById('calendarGrid');
    const monthYearDisplay = document.getElementById('monthYearDisplay');
    const prevMonthBtn = document.getElementById('prevMonth');
    const nextMonthBtn = document.getElementById('nextMonth');

    const eventModal = document.getElementById('eventModal');
    const eventForm = document.getElementById('eventForm');
    const closeModalBtn = document.getElementById('closeModal');
    const eventTextInput = document.getElementById('eventText');
    const eventTimeInput = document.getElementById('eventTime');
    const eventTypeInput = document.getElementById('eventType');

    let currentDate = new Date();
    let selectedDayKey = null;

    let eventsStorage = JSON.parse(localStorage.getItem('calendarEvents')) || {};

    const monthNames = [
      "Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio",
      "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"
    ];

    function renderCalendar() {
      calendarGrid.innerHTML = '';

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      monthYearDisplay.textContent = `${monthNames[month]} ${year}`.toUpperCase();

      const firstDayIndex = new Date(year, month, 1).getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < firstDayIndex; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.classList.add('day-cell', 'empty');
        calendarGrid.appendChild(emptyCell);
      }

      for (let day = 1; day <= totalDays; day++) {
        const cell = document.createElement('div');
        cell.classList.add('day-cell');

        const dayNumber = document.createElement('div');
        dayNumber.classList.add('day-number');
        dayNumber.textContent = day;
        cell.appendChild(dayNumber);

        const dayKey = `${year}-${month}-${day}`;

        if (eventsStorage[dayKey]) {
          eventsStorage[dayKey].forEach(evt => {
            const card = document.createElement('div');
            card.classList.add('event-card', evt.type);

            const title = document.createElement('span');
            title.classList.add('event-title');
            title.textContent = evt.text;

            const time = document.createElement('span');
            time.classList.add('event-time');
            time.textContent = evt.time;

            card.appendChild(title);
            card.appendChild(time);
            cell.appendChild(card);
          });
        }

        cell.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          selectedDayKey = dayKey;
          eventModal.classList.remove('hidden');
          eventTextInput.focus();
        });

        calendarGrid.appendChild(cell);
      }
    }

    prevMonthBtn.addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    });

    nextMonthBtn.addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    });

    eventForm.addEventListener('submit', (e) => {
      e.preventDefault();

      if (!selectedDayKey) return;

      const newEvent = {
        text: eventTextInput.value.trim(),
        time: eventTimeInput.value.trim(),
        type: eventTypeInput.value
      };

      if (!eventsStorage[selectedDayKey]) {
        eventsStorage[selectedDayKey] = [];
      }

      eventsStorage[selectedDayKey].push(newEvent);
      localStorage.setItem('calendarEvents', JSON.stringify(eventsStorage));

      eventForm.reset();
      eventModal.classList.add('hidden');

      renderCalendar();
    });

    closeModalBtn.addEventListener('click', () => {
      eventModal.classList.add('hidden');
      eventForm.reset();
    });

    renderCalendar();
  </script>
</body>
</html>
