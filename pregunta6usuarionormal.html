<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preguntas - ReSport+</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>

    <main class="contenedor-pregunta">
        <h1 class="titulo-app">ReSport+</h1>

        <div class="barra-progreso-contenedor">
            <div class="barra-progreso-relleno"></div>
        </div>

        <h2 class="pregunta-titulo">Cuan largo queres que sea tu entrenamiento?</h2>

        <form id="form-edad" class="opciones-form">
            <label class="opcion-card">
                <input type="radio" name="genero" value="Masculino" required>
                <span>Masculino</span>
            </label>

            <label class="opcion-card">
                <input type="radio" name="genero" value="Femenino">
                <span>Femenino</span>
            </label>

            <label class="opcion-card">
                <input type="radio" name="genero" value="No binario">
                <span>No binario</span>
            </label>

            <label class="opcion-card">
                <input type="radio" name="genero" value="Prefiero no decir">
                <span>Prefiero no decir</span>
            </label>
        </form>
    </main>

    <script>
        const form = document.getElementById('form-edad');
        const inputs = form.querySelectorAll('input[type="radio"]');

        inputs.forEach(input => {
            input.addEventListener('change', () => {
                const respuesta = input.value;
                localStorage.setItem('edadUsuario', respuesta);
            });
        });
    </script>
<section class="navegacion-inferior">
    <a href="pregunta5usuarionormal.html" class="boton-volver">
        <span class="material-icons icon-flecha">arrow_back</span>
    </a>
    <a href="pregunta7usuarionormal.html" class="siguiente">Siguiente</a>
</section>
</body>
</html>
